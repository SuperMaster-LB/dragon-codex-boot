name: build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\test.ps1
      - name: Package
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\scripts\package.ps1
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/
          if-no-files-found: error
